<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>طباعة · لوحة أصول</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  body{margin:0;background:#1f1a14;color:#efe6d2;font:15px Tahoma,sans-serif;display:grid;place-items:center;height:100vh}
  .w{text-align:center}.s{width:28px;height:28px;border:3px solid #4a4031;border-top-color:#c9a24a;border-radius:50%;margin:0 auto 12px;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="w"><div class="s"></div><div id="m">بيجهز الصفحات…</div></div>
<script>
// بتستقبل صفحات التقرير من البانل على أجزاء، وبعدين تعرضها وتفتح نافذة الطباعة
(function () {
  var parts = [], got = 0;
  function onMsg(arg) {
    var x; try { x = JSON.parse(arg.message); } catch (e) { return; }
    if (parts[x.i] === undefined) { parts[x.i] = x.d; got++; }
    document.getElementById('m').textContent = 'بيجهز الصفحات… ' + Math.round(100 * got / x.n) + '%';
    if (got === x.n) { var html = parts.join(''); document.open(); document.write(html); document.close(); }
  }
  Office.onReady(function () {
    Office.context.ui.addHandlerAsync(Office.EventType.DialogParentMessageReceived, onMsg, function () {
      Office.context.ui.messageParent('ready');
    });
  });
})();
</script>
</body>
</html>
