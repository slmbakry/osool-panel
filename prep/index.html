<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MBM · تجهيز الداتا</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2623;--muted:#6b736f;--line:#e4e2db;--gold:#c9a24a;--night:#1f1a14;--brand:#8c6b25;--soft:#f5eedc;--ok:#1f7a45;--okbg:#e6f4ea;--err:#a3261b;--errbg:#fdecea;--warn:#9a5b00;--warnbg:#fff4e0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
button,input,select{font:inherit;color:inherit}
.top{background:var(--night);color:#efe6d2;padding:12px 14px}
.brand{font-weight:600;color:var(--gold);display:flex;gap:6px;align-items:center}
.mbm{background:var(--gold);color:var(--night);border-radius:5px;padding:0 6px;font-weight:700}
.sub{font-size:12.5px;color:#a99d84;margin-top:2px}
main{padding:12px;max-width:900px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:14px;display:flex;gap:8px;align-items:center}
.n{background:var(--soft);color:var(--brand);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:700}
.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:600;cursor:pointer;background:var(--brand);color:#fff;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--bg);color:var(--ink)}
.r2{font-size:12.5px;color:var(--muted)}
.msg{border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
.msg.err{background:var(--errbg);color:var(--err)}.msg.ok{background:var(--okbg);color:var(--ok)}.msg.warn{background:var(--warnbg);color:var(--warn)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0}
.box{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px}.box .v{font-size:19px;font-weight:700}.box .k{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tab{border:1px solid var(--line);background:#fff;border-radius:16px;padding:3px 11px;font-size:12.5px;cursor:pointer}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.item{border-top:1px solid #f0e9da;padding:7px 0;font-size:13px}.item:first-child{border-top:0}
.item b{font-weight:600}.item .c{display:inline-block;font-size:11px;border-radius:6px;padding:0 6px;margin-inline-start:6px}
.c.fix{background:#fff2cc;color:#7a5c00}.c.review{background:var(--errbg);color:var(--err)}.c.note{background:#e8eefc;color:#2b4a8a}.c.new{background:var(--okbg);color:var(--ok)}.c.skip{background:#eee;color:#555}.c.flag{background:#f8cbad;color:#7a3300}.scp{margin-top:8px}.scp .g{margin:6px 0 2px;font-size:12px;font-weight:700;color:#6e531b;display:flex;align-items:center;gap:6px}.scp .g button{font:inherit;font-size:11px;border:0;background:none;color:#8a6d2b;text-decoration:underline;cursor:pointer;padding:0}.scp .chips{display:flex;flex-wrap:wrap;gap:5px}.scp .ch{border:1px solid #d8c9a6;background:#fff;border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer;color:#555}.scp .ch.on{background:#8a6d2b;border-color:#8a6d2b;color:#fff}.scp .ch i{font-style:normal;font-size:10px;opacity:.75;margin-inline-start:6px;padding:0 5px;border-radius:999px;background:rgba(0,0,0,.08)}.scp .ft{margin-top:6px;font-size:12px;color:#777;display:flex;gap:10px;flex-wrap:wrap}.scp .ft button{font:inherit;font-size:12px;border:0;background:none;color:#8a6d2b;text-decoration:underline;cursor:pointer;padding:0}.item .hd{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.item .ut{font-size:11px;opacity:.8}.go{margin-top:5px;border:1px solid #d8c9a6;background:#fffdf8;border-radius:7px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer;color:#6e531b}.go:hover{background:#f5eedc}
.ltr{direction:ltr;unicode-bidi:isolate}
.spin{width:22px;height:22px;border:3px solid var(--soft);border-top-color:var(--brand);border-radius:50%;display:inline-block;vertical-align:middle;animation:s .8s linear infinite;margin-inline-end:8px}
@keyframes s{to{transform:rotate(360deg)}}
.hide{display:none!important}
/* شاشة تعديل عقد المالك (نفس شاشة اللوحة) */
:root{--brand-soft:var(--soft);--err-bg:var(--errbg);--ok-bg:var(--okbg);--warn-bg:var(--warnbg);--r:12px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}label .req{color:var(--err)}
.sheet input,.sheet select{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;outline:none}
.sheet input:focus,.sheet select:focus{border-color:var(--brand)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
table.sch{width:100%;border-collapse:collapse;font-size:13px}table.sch td{padding:5px 0;border-bottom:1px solid var(--line)}table.sch td.m{width:42%}table.sch input{padding:5px 7px}table.sch .note{font-size:11px;color:var(--muted)}
.unit{border:1px solid var(--brand);background:var(--soft);border-radius:9px;padding:10px}.unit .t{font-weight:700}
details.more{margin-top:8px}details.more summary{cursor:pointer;font-size:12.5px;color:var(--brand)}
.overlay{position:fixed;inset:0;background:rgba(20,28,26,.45);display:none;align-items:flex-end;z-index:20}.overlay.on{display:flex}
.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 14px 14px}.sheet h2{margin:0 0 10px;font-size:16px}
.sheet .btn{width:auto;flex:1}.sheet .btn.ghost{flex:0 0 auto}.sheet .btn.primary{background:var(--brand);color:#fff}
.loading{padding:30px;text-align:center;color:var(--muted)}.loading .spin{display:block;margin:0 auto 8px}
.item .ed{margin-inline-start:6px}
.top .tl{display:flex;justify-content:space-between;align-items:center;gap:8px}.top .acts{display:flex;gap:6px}
.top .acts button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#efe6d2;border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer}
.nav{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:0 10px;position:sticky;top:0;z-index:5}
.nav button{flex:1;border:0;background:none;padding:10px 4px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.nav button.on{color:var(--brand);border-bottom-color:var(--brand)}
.srch{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:14px;outline:none}.srch:focus{border-color:var(--brand)}
.ct{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.ct .hd{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.ct .rows{margin-top:6px;border-top:1px dashed var(--line)}
.ct .row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}.ct .row:last-child{border-bottom:0}
.ct .go{margin-inline-end:6px;margin-top:8px}.ct .row .p{font-weight:700;font-variant-numeric:tabular-nums}.ct .row .v{font-weight:700}
input[type=file]{width:100%;border:1.5px dashed #d8c9a6;border-radius:10px;padding:14px;background:#fffdf8;cursor:pointer}
</style>
</head>
<body>
<div class="top">
  <div class="tl"><div class="brand"><span class="mbm" dir="ltr">MBM</span>تجهيز الداتا للسيستم الجديد</div>
    <div class="acts"><button id="refresh" title="اقرا الملف تاني">↻ تحديث</button><button id="gear" title="الإعدادات">⚙ الإعدادات</button></div></div>
  <div class="sub" id="scope">بيقرا الملف…</div>
</div>
<nav class="nav"><button data-t="find" class="on">العقود</button><button data-t="rev">المراجعة</button><button data-t="dev">ملف المطور</button></nav>
<main>
  <div id="status"></div>
  <section id="t-find">
    <input id="q" class="srch" placeholder="ابحث بالكود، أو العمارة والشقة، أو المالك، أو المستفيد" autocomplete="off">
    <div id="findRes"><div class="r2" style="padding:8px 2px">اكتب أي جزء من الكود أو الاسم.</div></div>
  </section>
  <section id="t-rev" class="hide"><div id="out"></div></section>
  <section id="t-dev" class="hide">
    <div id="devSum"></div>
    <div class="card">
      <div class="r2">ملف للمطور بنفس شكله: سطر لكل عقد، وفيه شيت "أشهر ملغاة" و"كشف المستحقات" و"تغييرات MBM". وملف مراجعة ليك انت بس.</div>
      <button class="btn" id="save" style="margin-top:8px">حمّل ملف المطور</button>
      <button class="btn" id="saveRev" style="margin-top:8px;background:#fff;color:var(--ink,#333);border:1px solid #ccc">حمّل ملف مراجعة العقود والمستحقات</button>
      <div id="saveMsg"></div>
    </div>
  </section>
</main>
<div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>
<script src="../logic.js"></script>
<script src="../followup.js"></script>
<script src="../store.js"></script>
<script src="../excel.js"></script>
<script src="../ownerform.js"></script>
<script src="leases.js"></script>
<script src="book.js"></script>
<script>
(function () {
  'use strict';
  var L = window.OsoolLogic, F = window.OsoolFollow, P = window.OsoolPrep;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var S = { settings: null, dev: null, devBuf: null, devName: '', data: null, res: null, view: 'review' };
  var MONTH_RE = /^[A-Z][a-z]{2}-\d{2}$/;
  var OWNER = ['كود', 'المشروع', 'بلوك', 'عمارة', 'شقة', 'الاسم', 'بداية العقد', 'نهاية العقد', 'قيمة الايجار', 'يسدد كل', 'التأمين', 'الدفع', 'تسويات', 'Beneficiary Name'];
  var ENTRY = ['تاريخ', 'ايراد', 'مصروف', 'كود', 'فئة', 'شهر', 'بداية الايجار', 'نهاية الايجار'];

  // ---------- قراية ملف أصول (على دفعات صغيرة عشان المتصفح مايتقلش) ----------
  function readCols(ctx, t, H, names, say) {
    var list = names.map(function (h) { return [h, H.indexOf(h)]; }).filter(function (x) { return x[1] !== -1; });
    var out = {}, p = Promise.resolve(), done = 0;
    for (var s = 0; s < list.length; s += 3) (function (batch) {
      p = p.then(function () { return new Promise(function (ok) { setTimeout(ok, 40); }); }).then(function () {
        var rs = batch.map(function (x) { return t.columns.getItemAt(x[1]).getDataBodyRange().load('values'); });
        return ctx.sync().then(function () { batch.forEach(function (x, j) { out[x[0]] = rs[j].values.map(function (r) { return r[0]; }); }); done += batch.length; if (say) say(done, list.length); });
      });
    })(list.slice(s, s + 3));
    return p.then(function () { return out; });
  }
  function head(ctx, name) { var t = ctx.workbook.tables.getItem(name); var h = t.getHeaderRowRange().load('values'); return ctx.sync().then(function () { return { t: t, H: h.values[0].map(function (x) { return String(x == null ? '' : x).trim(); }) }; }); }
  function readBook(say) {
    if (window.PrepMock) return window.PrepMock();
    return Excel.run(function (ctx) {
      var res = {};
      return head(ctx, 'owner').then(function (O) {
        S.ownerH = O.H;
        return readCols(ctx, O.t, O.H, OWNER, function (a, b) { say('شيت الملاك: ' + a + '/' + b); }).then(function (c) {
          res.owner = { cols: c };
          return readCols(ctx, O.t, O.H, O.H.filter(function (h) { return MONTH_RE.test(h); }), function (a, b) { say('شهور الملاك: ' + a + '/' + b); });
        }).then(function (m) { res.owner.months = m; });
      }).then(function () { return head(ctx, 'entry'); }).then(function (E) {
        return readCols(ctx, E.t, E.H, ENTRY, function (a, b) { say('الخزينة: ' + a + '/' + b); });
      }).then(function (t) { res.treasury = { cols: t }; return res; });
    });
  }
  function settings() {
    if (window.PrepMock) return window.__settings || F.DEFAULT_SETTINGS;
    try { var s = Office.context.document.settings.get('osoolPanel.scope'); return s ? JSON.parse(s) : F.DEFAULT_SETTINGS; } catch (e) { return F.DEFAULT_SETTINGS; }
  }
  // نطاق الملف من إعداد اللوحة المحفوظ جوه الملف (الإضافة دي نسخة تانية فمبتشوفش إعداد اللوحة العادي)
  function settingsFromFile() {
    if (window.PrepMock || !window.OsoolStore) return Promise.resolve(settings());
    return OsoolStore.read().then(function (x) { return x || settings(); });
  }

  // ---------- ExcelJS ----------
  function loadExcelJS() {
    if (window.ExcelJS) return Promise.resolve();
    return new Promise(function (ok, no) { var sc = document.createElement('script'); sc.src = '../vendor/exceljs.min.js'; sc.onload = ok; sc.onerror = function () { no(new Error('مكتبة الإكسيل متحملتش.')); }; document.head.appendChild(sc); });
  }
  var SHEET = 'العقود Contracts', SKIP = 'أشهر ملغاة Skipped months';
  function cellVal(v) { if (v && typeof v === 'object') { if (v.formula !== undefined || v.sharedFormula !== undefined) return v.result; if (v instanceof Date) return L.dateToSerial(v); if (v.richText) return v.richText.map(function (x) { return x.text; }).join(''); } return v; }
  function readDev(buf) {
    return loadExcelJS().then(function () {
      var wb = new ExcelJS.Workbook();
      return wb.xlsx.load(buf).then(function () {
        var ws = wb.getWorksheet(SHEET); if (!ws) throw new Error('ده مش ملف عقود الملاك بتاع المطور (مفيش شيت "' + SHEET + '").');
        var H = ws.getRow(1).values, rows = [];
        ws.eachRow(function (row, i) {
          if (i < 3) return; var o = { _row: i }, any = false;
          H.forEach(function (h, c) { if (!h) return; var v = cellVal(row.getCell(c).value); if (v !== null && v !== undefined && v !== '') any = true; o[h] = v; });
          if (any && o['كود الوحدة'] !== undefined && o['كود الوحدة'] !== null && String(o['كود الوحدة']).trim()) rows.push(o);
        });
        return { wb: wb, rows: rows, H: H };
      });
    });
  }
  var YELLOW = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFE699' } }, GREEN = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE6F4EA' } }, BLUE = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE8EEFC' } };
  // كل خانة لازم ياخد ستايل لوحده، لأن ExcelJS بيشارك الستايل بين الخانات
  function paint(cell, fill, date) { var st = JSON.parse(JSON.stringify(cell.style || {})); st.fill = JSON.parse(JSON.stringify(fill)); if (date) st.numFmt = 'dd/mm/yyyy'; cell.style = st; }
  var DATE_COLS = ['تاريخ الإنهاء', 'تاريخ التوقيع', 'بداية العقد', 'نهاية العقد', 'تاريخ أول دفعة', 'مسدد حتى'];
  function out(col, v) { if (DATE_COLS.indexOf(col) !== -1 && typeof v === 'number' && v > 20000) return L.serialToDate(v); return v === '' ? null : v; }
  function shown(col, v) { if (v === null || v === undefined || v === '') return '—'; if (DATE_COLS.indexOf(col) !== -1 && typeof v === 'number' && v > 20000) return L.fmt(L.serialToDate(v)); return typeof v === 'number' ? v.toLocaleString('en-US') : String(v); }
  // كل تحميل من نسخة نضيفة من ملف المطور، عشان الضغط مرتين ميكررش السطور
  // شكل ملف المطور (فاضي من غير أي داتا) جوه الأداة، وكل تحميل من نسخة نضيفة منه
  function template() { return fetch('template.xlsx', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('شكل ملف المطور متحملش.'); return r.arrayBuffer(); }); }
  function buildFile() { return template().then(readDev).then(function (d) { OsoolBook.applyDev(d.wb, S.res, S.scopeName, { fresh: true }); return d.wb.xlsx.writeBuffer(); }); }
  function buildReview() { return OsoolBook.reviewBook(ExcelJS, [{ src: S.scopeName, R: S.res }]).xlsx.writeBuffer(); }
  function download(buf, name) {
    var blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 3000); window.__lastBuf = buf; window.__lastName = name;
  }

  // ---------- الشاشة ----------
  var GRP = { Mivida: 'ميفيدا', Village: 'فيلدج', Porto: 'بورتو', 'الخارج': 'الخارج' };
  function scopeName(st) {
    var p = st.projects || []; if (st.mode === 'only') return p.map(function (x) { return GRP[x] || x; }).join(' و');
    return p.length ? 'كل المشاريع ما عدا ' + p.join('، ') : 'كل المشاريع';
  }
  // كل بند زي الشات: الكود والمالك والوحدة، وزرار يوديك على السطر (أو خانة الشهر) في شيت الملاك
  function card(code, badge, cls, body, mkey) {
    var u = (S.res.units || {})[code] || {};
    return '<div class="item"><div class="hd"><b class="ltr">' + esc(code) + '</b> · ' + esc(u.owner || '') +
      '<span class="c ' + cls + '">' + esc(badge) + '</span></div>' +
      (u.title ? '<div class="r2 ut">' + esc(u.title) + '</div>' : '') +
      '<div class="r2">' + body + '</div>' +
      (u.idx !== undefined ? '<button class="go" data-code="' + esc(code) + '"' + (mkey ? ' data-m="' + esc(mkey) + '"' : '') + '>روح للسطر' + (mkey ? ' (' + esc(L.monthLabel(mkey)) + ')' : '') + '</button>' +
        '<button class="go ed" data-ren="' + esc(code) + '">جدّد العقد</button><button class="go ed" data-edt="' + esc(code) + '">عدّل العقد</button>' : '') + '</div>';
  }
  // ---------- تعديل عقد المالك مباشر في الملف (نفس شاشة اللوحة) ----------
  var OFM = null;
  function unitsFromData() {
    var c = S.data.owner.cols, out = [], g = function (k, i) { return c[k] ? c[k][i] : ''; };
    for (var i = 0; i < (c['كود'] || []).length; i++) {
      var code = String(g('كود', i) == null ? '' : g('كود', i)).trim(); if (!code) continue;
      var e = g('نهاية العقد', i);
      out.push({ idx: i, code: code, project: g('المشروع', i) || '', block: g('بلوك', i) || '', building: String(g('عمارة', i) || ''), apt: String(g('شقة', i) || ''), owner: g('الاسم', i) || '', settle: g('تسويات', i) || '', ownerEnd: e ? L.serialToDate(e) : null, every: Number(g('يسدد كل', i)) || 1 });
    }
    return out;
  }
  function editContract(mode, code) {
    var A = window.__prepA || window.OsoolExcel; // __prepA للتجربة بس
    if (!A || !window.OsoolOwnerForm) return;
    var units = unitsFromData(), u = units.filter(function (x) { return x.code === String(code); })[0]; if (!u) return;
    var App = {
      openSheet: function (h) { $('sheet').innerHTML = h; $('ov').classList.add('on'); },
      closeSheet: function () { $('ov').classList.remove('on'); },
      unitTitle: function (x) { var ok = function (v) { return v && v !== '0'; }; return [x.project, ok(x.block) && ('بلوك ' + x.block), ok(x.building) && ('عمارة ' + x.building), ok(x.apt) && ('شقة ' + x.apt)].filter(Boolean).join(' · '); },
      checkHtml: function (res) { var m = (res && res.mismatch) || []; return m.length ? '<div class="msg err">اتكتب، بس فيه ' + m.length + ' خانة مختلفة عن المطلوب. راجعها في الشيت.</div>' : '<div class="msg ok">اتأكدت: رجعت قريت كل الخانات من الملف واتكتبت صح.</div>'; }
    };
    OFM = OsoolOwnerForm.create({ S: { units: units, ownerMonths: S.data.owner.months }, A: A, L: L, F: F, $: $, esc: esc,
      money: function (n) { return Math.round(Number(n) || 0).toLocaleString('en-US'); }, digits: function (v) { return String(v == null ? '' : v).replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); }).replace(/[^\d.\-]/g, ''); },
      today: function () { return L.todayUTC(); }, App: App,
      errHtml: function (e) { return '<div class="msg err">' + esc((e && e.message) || e) + '</div>'; },
      loadingHtml: function (t) { return '<div class="loading"><span class="spin"></span>' + esc(t) + '</div>'; },
      // بعد الحفظ: نقفل الشاشة ونطلّع العقود تاني من الملف بعد التعديل
      onDone: function () { analyze(); } });
    OFM.open(mode, u);
  }
  $('ov').onclick = function (e) { if (e.target === this) this.classList.remove('on'); };
  function goTo(code, mkey) {
    var u = (S.res.units || {})[code]; if (!u) return;
    if (window.PrepMock) { window.__goto = [code, u.idx, mkey || '']; return; }
    Excel.run(function (ctx) {
      var t = ctx.workbook.tables.getItem('owner'), body = t.getDataBodyRange(), ci = mkey ? S.ownerH.indexOf(mkey) : -1;
      var r = ci >= 0 ? body.getCell(u.idx, ci) : body.getRow(u.idx);
      t.worksheet.activate(); r.select();
      return ctx.sync();
    }).catch(function (e) { $('saveMsg').innerHTML = '<div class="msg err">' + esc(e.message || e) + '</div>'; });
  }
  function draw() {
    var R = S.res, c = R.counts, list, M = function (s) { return L.monthKey(L.serialToDate(s)); };
    var bad = R.dues.filter(function (x) { return x.state !== 'مظبوط'; });
    var reviews = R.changes.filter(function (x) { return x.kind === 'review'; }), notes = R.changes.filter(function (x) { return x.kind === 'note' || x.kind === 'fix'; });
    var tabs = [['review', 'محتاج قرار', reviews.length], ['dues', 'المستحقات', bad.length], ['note', 'ملاحظات', notes.length], ['skip', 'أشهر ملغاة', R.skipped.length]];
    if (S.view === 'dues') list = bad.sort(function (a, b) { return Math.abs(b.balance) - Math.abs(a.balance); }).map(function (x) {
      var sh = x.months.filter(function (m) { return m.state === 'ناقص' || m.state === 'زايد'; });
      return card(x.code, x.state, x.balance > 0 ? 'review' : 'note', 'مستحق ' + esc(shown('', x.due)) + ' · مدفوع ' + esc(shown('', x.paid)) + ' · الفرق <b>' + esc(shown('', x.balance)) + '</b>' +
        (sh.length ? '<br>' + sh.map(function (m) { return esc(L.monthLabel(m.key)) + ': ' + esc(shown('', m.diff)); }).join('، ') : ''), sh.length ? sh[0].key : '');
    });
    else if (S.view === 'note') list = notes.map(function (x) { return card(x.code, 'ملاحظة', 'note', esc(x.why)); });
    else if (S.view === 'review') list = reviews.map(function (x) { var mk = (/(يناير|فبراير|مارس|أبريل|مايو|يونيو|يوليو|أغسطس|سبتمبر|أكتوبر|نوفمبر|ديسمبر) (\d{4})/.exec(x.why) || [])[0]; return card(x.code, 'قرار', 'review', esc(x.why), mk ? keyOfLabel(mk) : ''); });
    else if (S.view === 'new') list = R.newRows.map(function (n) { var v = n.values; return card(n.code, String(v['الحالة'] || '').split(' /')[0], 'new', esc(shown('بداية العقد', v['بداية العقد'])) + ' ← ' + esc(shown('نهاية العقد', v['نهاية العقد'])) + ' · ' + esc(shown('', v['الإيجار الشهري (السنة الأولى)'])) + ' ج · مسدد حتى ' + esc(shown('مسدد حتى', v['مسدد حتى'])) + '<br>' + esc(n.why)); });
    else list = R.skipped.map(function (x) { return card(x.code, 'شهر ملغي', 'skip', esc(L.monthLabel(M(x.month))) + ' فاضي في الشيت', M(x.month)); });
    $('out').innerHTML = '' +
      '<div class="tabs">' + tabs.map(function (t) { return '<button class="tab' + (S.view === t[0] ? ' on' : '') + '" data-v="' + t[0] + '">' + t[1] + ' (' + t[2] + ')</button>'; }).join('') + '</div>' +
      '<div class="card" style="max-height:60vh;overflow:auto;padding:4px 10px">' + (list.length ? list.slice(0, 400).join('') + (list.length > 400 ? '<div class="r2">ظاهر ٤٠٠ من ' + list.length + '، والكل في ملف المراجعة.</div>' : '') : '<div class="r2" style="padding:8px 0">مفيش.</div>') + '</div>';
    document.querySelectorAll('.tab').forEach(function (b) { b.onclick = function () { S.view = b.dataset.v; draw(); }; });
    bindGo($('out'));
    drawDev(); drawFind();
  }
  // ملخص ملف المطور
  function drawDev() {
    var R = S.res, c = R.counts, bad = R.dues.filter(function (x) { return x.state !== 'مظبوط'; });
    var nRev = R.changes.filter(function (x) { return x.kind === 'review'; }).length, nNote = R.changes.filter(function (x) { return x.kind === 'note' || x.kind === 'fix'; }).length;
    $('devSum').innerHTML = '<div class="sum">' +
      '<div class="box"><div class="v">' + R.scope + '</div><div class="k">وحدة في نطاق الملف</div></div>' +
      '<div class="box"><div class="v">' + R.newRows.length + '</div><div class="k">عقد (منهم ' + c.renewals + ' تجديد بعد 1/7)</div></div>' +
      '<div class="box"><div class="v" style="color:var(--err)">' + nRev + '</div><div class="k">محتاج قرار</div></div>' +
      '<div class="box"><div class="v" style="color:var(--err)">' + bad.length + '</div><div class="k">وحدة عليها ناقص</div></div>' +
      '<div class="box"><div class="v">' + nNote + '</div><div class="k">ملاحظة</div></div>' +
      '<div class="box"><div class="v">' + c.outSkipped + '</div><div class="k">وحدة خارج التشغيل اتعدّت</div></div></div>';
  }
  // ---------- العقود: بحث ← العقد الحالي ومدته وقيمته ومسدد حتى، وزراير جدّد/عدّل/روح للسطر ----------
  function drawFind() {
    if (!S.res) return;
    var q = L.norm($('q').value || '').trim(), box = $('findRes');
    if (!q) { box.innerHTML = '<div class="r2" style="padding:8px 2px">اكتب أي جزء من الكود أو الاسم.</div>'; return; }
    var c = S.data.owner.cols, ws = q.split(/\s+/), hits = [];
    Object.keys(S.res.units).forEach(function (code) {
      var u = S.res.units[code], i = u.idx, ben = c['Beneficiary Name'] ? c['Beneficiary Name'][i] : '';
      var hay = L.norm([code, u.owner, u.title, c['عمارة'] && c['عمارة'][i], c['شقة'] && c['شقة'][i], (c['عمارة'] && c['عمارة'][i]) + '-' + (c['شقة'] && c['شقة'][i]), ben].join(' '));
      if (ws.every(function (w) { return hay.indexOf(w) !== -1; })) hits.push(code);
    });
    box.innerHTML = hits.length ? hits.slice(0, 30).map(contractCard).join('') + (hits.length > 30 ? '<div class="r2">ظاهر ٣٠ من ' + hits.length + '، دقق البحث.</div>' : '') : '<div class="r2" style="padding:8px 2px">مفيش وحدة بالبيانات دي في نطاق الملف.</div>';
    bindGo(box);
  }
  function contractCard(code) {
    var u = S.res.units[code] || {}, rows = S.res.newRows.filter(function (n) { return n.code === code; }).sort(function (a, b) { return (a.values['بداية العقد'] || 0) - (b.values['بداية العقد'] || 0); });
    var ben = S.data.owner.cols['Beneficiary Name'] ? S.data.owner.cols['Beneficiary Name'][u.idx] : '';
    var D = function (v) { return v ? L.fmt(L.serialToDate(v)) : '—'; };
    var flags = S.res.changes.filter(function (x) { return x.code === code && x.kind === 'review'; }).length;
    return '<div class="ct"><div class="hd"><b class="ltr">' + esc(code) + '</b> · ' + esc(u.owner || '') + (flags ? '<span class="c review">' + flags + ' قرار</span>' : '') + '</div>' +
      '<div class="r2">' + esc(u.title || '') + (ben && ben !== u.owner ? ' · المستفيد: ' + esc(ben) : '') + '</div>' +
      (rows.length ? '<div class="rows">' + rows.map(function (n) {
        var v = n.values, st = String(v['الحالة'] || '').split(' /')[0];
        return '<div class="row"><span><span class="p">' + D(v['بداية العقد']) + ' ← ' + D(v['نهاية العقد']) + '</span> <span class="r2">' + esc(st) + '</span></span>' +
          '<span><span class="v">' + esc(shown('', v['الإيجار الشهري (السنة الأولى)'])) + '</span> <span class="r2">· مسدد حتى ' + D(v['مسدد حتى']) + '</span></span></div>';
      }).join('') + '</div>' : '<div class="r2">مفيش عقد طالع للوحدة دي.</div>') +
      '<button class="go" data-code="' + esc(code) + '">روح للسطر</button><button class="go ed" data-ren="' + esc(code) + '">جدّد العقد</button><button class="go ed" data-edt="' + esc(code) + '">عدّل العقد</button></div>';
  }
  function bindGo(root) { root.querySelectorAll('.go').forEach(function (b) { b.onclick = function () { if (b.dataset.ren) editContract('renew', b.dataset.ren); else if (b.dataset.edt) editContract('edit', b.dataset.edt); else goTo(b.dataset.code, b.dataset.m); }; }); }
  var AR_M = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
  function keyOfLabel(t) { var p = t.split(' '); var mi = AR_M.indexOf(p[0]); return mi < 0 ? '' : L.monthKey(new Date(Date.UTC(+p[1], mi, 1))); }
  // بيقرا الملف ويحلل (أول ما الأداة تتفتح، وبعد أي تعديل، ومن زرار التحديث)
  function analyze() {
    var say = function (t) { $('status').innerHTML = '<div class="msg"><span class="spin"></span>' + esc(t) + '</div>'; };
    say('بيقرا ملف أصول…'); $('refresh').disabled = true;
    return readBook(say).then(function (data) {
      S.data = data; say('بيحلل…');
      S.res = P.reconcile({ devRows: [], owner: S.data.owner, treasury: S.data.treasury, settings: S.settings });
      $('status').innerHTML = ''; $('refresh').disabled = false; draw();
    }).catch(function (e) { $('refresh').disabled = false; $('status').innerHTML = '<div class="msg err">' + esc(e.message || e) + '</div>'; });
  }
  $('refresh').onclick = analyze;
  var qt; $('q').oninput = function () { clearTimeout(qt); qt = setTimeout(drawFind, 150); };
  document.querySelectorAll('.nav button').forEach(function (b) { b.onclick = function () {
    document.querySelectorAll('.nav button').forEach(function (x) { x.classList.toggle('on', x === b); });
    ['find', 'rev', 'dev'].forEach(function (t) { $('t-' + t).classList.toggle('hide', t !== b.dataset.t); });
  }; });
  // الإعدادات: اختيار المشاريع
  $('gear').onclick = function () {
    $('sheet').innerHTML = '<h2>الإعدادات</h2><div class="scp" id="scopeBox"></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn ghost" id="stX">قفل</button><button class="btn primary" id="stGo">طبّق وحلل تاني</button></div>';
    $('ov').classList.add('on'); S.pick0 = JSON.stringify(S.pick); drawScope();
    $('stX').onclick = function () { S.pick = JSON.parse(S.pick0); applyPick(); $('ov').classList.remove('on'); };
    $('stGo').onclick = function () { $('ov').classList.remove('on'); analyze(); };
  };
  $('save').onclick = function () {
    var btn = this; btn.disabled = true; $('saveMsg').innerHTML = '<div class="msg"><span class="spin"></span>بيجهز الملف…</div>';
    buildFile().then(function (buf) {
      var t = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
      var name = 'عقود الملاك للسيستم - ' + S.scopeName + ' - ' + p(t.getDate()) + '-' + p(t.getMonth() + 1) + '-' + t.getFullYear() + '.xlsx';
      download(buf, name); btn.disabled = false;
      $('saveMsg').innerHTML = '<div class="msg ok">اتحمّل: ' + esc(name) + '. لو هتكمّل على ملف أصول تاني، ارفع الملف ده في الخطوة الأولى هناك.</div>';
    }).catch(function (e) { btn.disabled = false; $('saveMsg').innerHTML = '<div class="msg err">' + esc(e.message || e) + '</div>'; });
  };
  $('saveRev').onclick = function () {
    var btn = this; btn.disabled = true; $('saveMsg').innerHTML = '<div class="msg"><span class="spin"></span>بيجهز ملف المراجعة…</div>';
    buildReview().then(function (buf) {
      var t = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
      var name = 'مراجعة العقود والمستحقات - ' + S.scopeName + ' - ' + p(t.getDate()) + '-' + p(t.getMonth() + 1) + '-' + t.getFullYear() + '.xlsx';
      download(buf, name); btn.disabled = false;
      $('saveMsg').innerHTML = '<div class="msg ok">اتحمّل: ' + esc(name) + '. ده ليك انت بس، مش للمطور.</div>';
    }).catch(function (e) { btn.disabled = false; $('saveMsg').innerHTML = '<div class="msg err">' + esc(e.message || e) + '</div>'; });
  };
  // ---------- اختيار النطاق: مشاريع الملف كله، والاختيار بيبدأ من إعداد الملف، ومش بيتحفظ في اللوحة ----------
  function loadProjects() {
    if (window.PrepMock) return window.PrepMock().then(function (d) { return d.owner.cols['المشروع'] || []; });
    return Excel.run(function (ctx) { return head(ctx, 'owner').then(function (O) { return readCols(ctx, O.t, O.H, ['المشروع'], function () { }); }).then(function (c) { return c['المشروع'] || []; }); });
  }
  function drawScope() {
    var box = $('scopeBox'), P0 = S.projects || [], on = S.pick; if (!box) return;
    var html = F.GROUPS.map(function (g) {
      var ps = P0.filter(function (p) { return F.groupOf(p.name) === g; }); if (!ps.length) return '';
      return '<div class="g">' + esc(GRP[g] || g) + ' <button data-g="' + esc(g) + '">' + (ps.every(function (p) { return on[p.key]; }) ? 'شيل الكل' : 'اختار الكل') + '</button></div><div class="chips">' +
        ps.map(function (p) { return '<button class="ch' + (on[p.key] ? ' on' : '') + '" data-p="' + esc(p.key) + '"><bdi>' + esc(p.name) + '</bdi><i>' + p.n + '</i></button>'; }).join('') + '</div>';
    }).join('');
    var n = P0.filter(function (p) { return on[p.key]; }).reduce(function (a, p) { return a + p.n; }, 0);
    box.innerHTML = '<div class="r2" style="margin-bottom:2px">النطاق: اختار المشاريع اللي تطلع عقودها</div>' + html +
      '<div class="ft"><span>' + n + ' وحدة متختارة</span><button id="scpReset">رجّع إعداد الملف</button></div>';
    box.querySelectorAll('.ch').forEach(function (b) { b.onclick = function () { on[b.dataset.p] = !on[b.dataset.p]; applyPick(); }; });
    box.querySelectorAll('.g button').forEach(function (b) { b.onclick = function () { var ps = P0.filter(function (p) { return F.groupOf(p.name) === b.dataset.g; }), all = ps.every(function (p) { return on[p.key]; }); ps.forEach(function (p) { on[p.key] = !all; }); applyPick(); }; });
    $('scpReset').onclick = function () { pickFrom(S.fileSettings); applyPick(); };
  }
  function pickFrom(st) { S.pick = {}; (S.projects || []).forEach(function (p) { S.pick[p.key] = F.inScope({ project: p.name }, st, true); }); }
  function applyPick() {
    var sel = (S.projects || []).filter(function (p) { return S.pick[p.key]; });
    S.settings = Object.assign({}, S.fileSettings, { mode: 'only', projects: sel.map(function (p) { return p.name; }) });
    var gs = F.groupsIn(sel.map(function (p) { return { project: p.name }; }));
    S.scopeName = gs.map(function (g) { var all = (S.projects || []).filter(function (p) { return F.groupOf(p.name) === g; }), mine = sel.filter(function (p) { return F.groupOf(p.name) === g; });
      if (mine.length === all.length) return GRP[g] || g;
      var out = all.filter(function (p) { return mine.indexOf(p) === -1; });
      if (mine.length <= 3) return mine.map(function (p) { return p.name; }).join(' و');
      return (GRP[g] || g) + (out.length <= 3 ? ' ما عدا ' + out.map(function (p) { return p.name; }).join(' و') : ' (جزء)'); }).join(' و') || 'مفيش';
    $('scope').textContent = 'الملف ده: ' + S.scopeName; if ($('stGo')) $('stGo').disabled = !sel.length;
    drawScope();
  }
  function start() {
    settingsFromFile().then(function (st) {
      S.fileSettings = st; S.settings = st; S.scopeName = scopeName(st); $('scope').textContent = 'الملف ده: ' + S.scopeName;
      return loadProjects().then(function (col) {
        var cnt = {}, name = {}; col.forEach(function (v) { var p = String(v == null ? '' : v).trim(); if (!p) return; var k = p.toLowerCase(); cnt[k] = (cnt[k] || 0) + 1; if (!name[k]) name[k] = p; });
        S.projects = Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a]; }).map(function (k) { return { key: k, name: name[k], n: cnt[k] }; });
        pickFrom(st); applyPick();
        return analyze();
      });
    }).catch(function (e) { $('status').innerHTML = '<div class="msg err">' + esc(e.message || e) + '</div>'; });
  }
  if (window.Office && Office.onReady && !window.PrepMock) Office.onReady(start); else start();
})();
</script>
</body>
