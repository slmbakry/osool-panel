<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MBM · لوحة أصول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1d2422; --muted:#6b736f; --line:#e4e2db;
  --brand:#8c6b25; --brand-ink:#ffffff; --brand-soft:#f5eedc; --gold:#c9a24a; --night:#1f1a14;
  --warn:#9a5b00; --warn-bg:#fff4e0; --err:#a3261b; --err-bg:#fdecea; --ok:#1f7a45; --ok-bg:#e6f4ea;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--night);color:#efe6d2;padding:10px 14px 10px;overflow:hidden}
.top.hero{padding-bottom:16px}
.top.hero:after{content:'';position:absolute;left:-46px;bottom:-80px;width:210px;height:210px;border-radius:50%;border:1px solid rgba(201,162,74,.18);pointer-events:none}
.top.hero:before{content:'';position:absolute;left:-14px;bottom:-120px;width:210px;height:210px;border-radius:50%;border:1px solid rgba(201,162,74,.10);pointer-events:none}
.brandrow{display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.brand{font-weight:600;font-size:15px;color:var(--gold);flex:1;display:flex;align-items:center;gap:6px}
.stat{font-size:11px;color:#a99d84;font-weight:400}
.iconbtn{background:rgba(255,255,255,.08);border:0;color:#d9caa6;border-radius:9px;width:32px;height:32px;cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{background:rgba(255,255,255,.16)}
.iconbtn svg{width:17px;height:17px}
#hero{position:relative;z-index:1}
.hdate{margin-top:12px;font-size:25px;font-weight:700;color:#fff;line-height:1.3}
.hdate span{color:var(--gold)}
.hsay{margin-top:4px;font-size:14px;line-height:1.75;color:#d8ccb1;min-height:24px}
.hsay b{color:#e2c47c;font-weight:600}
.hrole{position:absolute;left:0;top:16px;font-size:11.5px;color:#e2c47c;border:1px solid rgba(226,196,124,.35);border-radius:20px;padding:1px 10px;background:none;cursor:pointer}
.crumb{margin-top:8px;font-size:18px;font-weight:700;color:#fff;position:relative;z-index:1}
.subnav{display:flex;gap:6px;margin-top:10px;position:relative;z-index:1}
.subnav button{flex:1;border:1px solid rgba(226,196,124,.25);background:transparent;color:#cdbf9f;border-radius:9px;padding:6px 4px;cursor:pointer;font-weight:500;font-size:13px}
.subnav button.on{background:var(--gold);border-color:var(--gold);color:var(--night);font-weight:600}
.nav{position:fixed;bottom:0;inset-inline:0;height:62px;background:#fff;border-top:1px solid var(--line);display:flex;padding:5px 8px 7px;z-index:7}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:500;color:#9a8f7b;background:none;border:0;border-radius:12px;cursor:pointer;padding-top:5px}
.nav svg{width:21px;height:21px}
.nav button.on{color:var(--brand);background:var(--brand-soft)}
.focus{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:6px}
.focus h3{margin:0 0 4px;font-size:13.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.focus h3 svg{width:15px;height:15px;color:var(--brand)}
.focus h3 .link{margin-inline-start:auto;text-decoration:none}
.bigs{display:flex;gap:14px;margin-top:8px}.bigs>div{flex:1}
.bigs .v{font-size:22px;font-weight:700;direction:ltr;text-align:right}.bigs .k{font-size:12px;color:var(--muted)}
.vin{color:var(--ok)}.vout{color:var(--err)}
.mini{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #f0e9da}
.mini:first-of-type{border-top:0}
.mini .t{flex:1;min-width:0}.mini .t b{display:block;font-weight:600}.mini .t i{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.act{font-size:12px;font-weight:600;color:var(--brand);border:1px solid #d9c79f;background:#fff;border-radius:8px;padding:4px 9px;white-space:nowrap;cursor:pointer}
.tagx{font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px;white-space:nowrap}
.tagx.late{background:#fbe9e7;color:var(--err)}.tagx.soon{background:#f8efd9;color:#a3741b}.tagx.ok{background:var(--ok-bg);color:var(--ok)}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:12px;overflow:hidden;margin-top:8px}
.kgrid>button{background:#fff;padding:10px 11px;cursor:pointer;border:0;text-align:right}
.kgrid .v{font-size:19px;font-weight:700;direction:ltr;text-align:right}.kgrid .k{font-size:12px;color:var(--muted)}
.lh{display:flex;align-items:center;margin:14px 4px 7px;font-size:13.5px;font-weight:600;color:var(--muted)}
.lh .link{margin-inline-start:auto;text-decoration:none}
.flist{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.frow{display:flex;align-items:center;gap:11px;padding:11px 13px;border-top:1px solid #f0e9da;cursor:pointer}
.frow:first-child{border-top:0}
.frow:hover{background:#fcf9f2}
.fico{width:34px;height:34px;border-radius:10px;background:#f6efdf;display:grid;place-items:center;flex:0 0 34px;color:var(--brand)}
.fico svg{width:18px;height:18px}
.fico.r{background:#fbecea;color:var(--err)}.fico.g{background:#e8f2ec;color:var(--ok)}
.frow .t{flex:1;min-width:0}.frow .t b{display:block;font-weight:600}.frow .t i{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.fnum{font-size:16px;font-weight:700;direction:ltr;white-space:nowrap}
.fnum.r{color:var(--err)}.fnum.g{color:var(--ok)}
.fstar{width:15px;height:15px;color:var(--gold);flex:0 0 15px;background:none;border:0;padding:0;cursor:pointer}
.fstar svg{width:15px;height:15px}
.fed{display:flex;gap:4px}.fed button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--muted);padding:0}
.addfav{display:block;width:100%;border:1.5px dashed #d8c9a6;background:none;border-radius:12px;margin-top:10px;padding:10px;text-align:center;font-weight:500;color:var(--brand);cursor:pointer}
.bankbox{background:#faf6ec;border:1px solid #eadfc4;border-radius:10px;padding:9px 11px;margin-top:6px}
.bankbox dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px;margin:0}
.bankbox dt{color:var(--muted)}.bankbox dd{margin:0;font-weight:600;text-align:left;direction:ltr}
.bankbox dd.ar{direction:rtl;text-align:right}
.roles{display:grid;gap:8px;margin-top:6px}
.roles button{display:flex;align-items:center;gap:12px;text-align:right;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;cursor:pointer}
.roles button.on{border-color:var(--brand);background:var(--brand-soft)}
.roles b{display:block;font-size:15px}.roles i{display:block;font-style:normal;font-size:12px;color:var(--muted)}
main{padding:12px 12px 150px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.card h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.card h3 .n{background:var(--brand-soft);color:var(--brand);border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:11px;font-weight:700}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
label .req{color:var(--err)}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea{min-height:56px;resize:vertical}
.ltr{direction:ltr;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:9px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:7px;padding:7px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chip{display:inline-block;background:var(--brand-soft);color:var(--brand);border-radius:20px;padding:2px 10px;font-size:12px;margin-top:8px}
.results{border:1px solid var(--line);border-radius:8px;margin-top:6px;max-height:260px;overflow:auto;background:#fff}
.results button{display:block;width:100%;text-align:right;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 10px;cursor:pointer}
.results button:last-child{border-bottom:0}
.results button:hover,.results button:focus{background:var(--brand-soft);outline:none}
.r1{font-weight:600}.r2{font-size:12px;color:var(--muted)}
.unit{border:1px solid var(--brand);background:var(--brand-soft);border-radius:9px;padding:10px}
.unit .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.unit .t{font-weight:700}
.link{background:none;border:0;color:var(--brand);cursor:pointer;font-weight:600;padding:0;text-decoration:underline;font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin-top:8px;font-size:12.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.code{display:flex;align-items:center;justify-content:space-between;margin-top:10px;background:#fff;border-radius:8px;padding:7px 10px}
.code b{font-family:Consolas,monospace;font-size:15px;direction:ltr}
table.sch{width:100%;border-collapse:collapse;font-size:13px}
table.sch td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:middle}
table.sch td.m{width:42%}
table.sch input{padding:5px 7px}
table.sch .note{font-size:11px;color:var(--muted)}
.total{display:flex;justify-content:space-between;font-weight:700;margin-top:8px}
.empty{color:var(--muted);font-size:12.5px}
.msgs{margin-bottom:10px}
.msg{border-radius:8px;padding:8px 10px;font-size:12.5px;margin-bottom:6px}
.msg.err{background:var(--err-bg);color:var(--err)}
.msg.warn{background:var(--warn-bg);color:var(--warn)}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
/* شريط التسجيل: ثابت تحت الشاشة، ورسالة التأكيد فوق الزرار على طول */
.sbar{position:sticky;bottom:-14px;background:#fff;margin:10px -14px -14px;padding:10px 14px 14px;border-top:1px solid var(--line,#e8e2d6);box-shadow:0 -6px 14px rgba(20,18,14,.06);z-index:5}
.sbar>div:first-child:not(:empty){max-height:38vh;overflow:auto}
.sbar .msg.warn{border:1.5px solid var(--warn);font-weight:600;font-size:13.5px;padding:10px 12px}
.sbar .msg.err{border:1.5px solid var(--err);font-weight:600}
.sbar .btn{white-space:nowrap;padding-inline:10px}
@media (min-width:900px){.sbar{bottom:-18px;margin:12px -22px -18px;padding:12px 22px 18px}}
.bar{position:fixed;bottom:62px;inset-inline:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;z-index:6}
.btn{flex:1;border:0;border-radius:9px;padding:10px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--bg);color:var(--ink);flex:0 0 auto;padding:10px 14px}
.overlay{position:fixed;inset:0;background:rgba(20,28,26,.45);display:none;align-items:flex-end;z-index:20}
.overlay.on{display:flex}
.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 14px 14px}
.sheet h2{margin:0 0 10px;font-size:16px}
.loading{padding:40px 16px;text-align:center;color:var(--muted)}
.spin{width:26px;height:26px;border:3px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;margin:0 auto 10px;animation:s 0.8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.rcard{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px}
.rcard .top2{display:flex;justify-content:space-between;gap:8px}
.badge{font-size:11px;border-radius:20px;padding:1px 8px;white-space:nowrap;height:fit-content}
.badge.live{background:var(--ok-bg);color:var(--ok)}.badge.book{background:var(--warn-bg);color:var(--warn)}.badge.done{background:var(--bg);color:var(--muted)}
.done{text-align:center;padding:26px 10px}
.done .big{font-size:40px;color:var(--ok)}
.hide{display:none!important}
.mbm{background:var(--gold);color:var(--night);border-radius:5px;padding:0 6px;margin-inline-end:2px;letter-spacing:.5px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;transition:box-shadow .3s,transform .15s}
.mbm .pro{display:none;font-weight:800;margin-inline-start:5px;padding-inline-start:5px;border-inline-start:1.5px solid rgba(31,26,20,.35)}
.mbm.on{background:linear-gradient(135deg,#f3d98b,#c9a24a 55%,#a8822f);box-shadow:0 0 0 1px #f3d98b,0 0 12px rgba(226,196,124,.55);cursor:pointer}
.mbm.on .pro{display:inline}
.mbm.hold{transform:scale(.94);box-shadow:0 0 0 2px #f3d98b,0 0 16px rgba(226,196,124,.7);transition:box-shadow 1.2s,transform 1.2s}
.tgs{display:flex;flex-wrap:wrap;gap:6px}
.tg{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 11px;font-size:12px;cursor:pointer;color:var(--muted)}
.tg.on{background:var(--brand);border-color:var(--brand);color:#fff}
details.more{margin-top:10px}details.more summary{cursor:pointer;color:var(--brand);font-weight:600;font-size:12.5px}
.addbtn{width:100%;margin-bottom:10px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.sum .box{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 10px}
.sum .v{font-size:17px;font-weight:700}.sum .k{font-size:11.5px;color:var(--muted)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.amt{font-weight:700;font-size:15px;white-space:nowrap}
.late{color:var(--err)}.okc{color:var(--ok)}
.pill{display:inline-block;background:var(--bg);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--muted)}
.rcard.click{cursor:pointer}.rcard.click:hover{border-color:var(--brand)}
table.mt{width:100%;border-collapse:collapse;font-size:12.5px}
table.mt th{font-weight:500;color:var(--muted);text-align:right;padding:4px 0;border-bottom:1px solid var(--line)}
table.mt td{padding:4px 0;border-bottom:1px solid var(--line)}
table.mt td.n,table.mt th.n{text-align:left;direction:ltr}
.strike{text-decoration:line-through;color:var(--muted)}
.back{background:none;border:0;color:var(--brand);font-weight:600;cursor:pointer;padding:0 0 10px}
.radio{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer}
.radio input,.chk input{width:auto}
.chk{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}
.chks{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.brand{white-space:nowrap;min-width:0}@media (max-width:460px){.brand .stat{display:none}}
.trialpill{flex:none;border:1px solid rgba(226,196,124,.45);background:rgba(201,162,74,.12);color:#e2c47c;border-radius:20px;font-size:10.5px;padding:0 8px;line-height:18px;cursor:pointer;margin-inline-start:2px}.trialpill:hover{background:rgba(201,162,74,.25)}
.trial{background:linear-gradient(135deg,#2a2218,#1f1a14);color:#efe6d2;border-radius:14px;padding:11px 13px;margin-bottom:10px;border:1px solid rgba(201,162,74,.45)}.trial .tt{font-weight:700;color:var(--gold);font-size:14px}.trial .tl{font-size:12.5px;line-height:1.7;margin-top:2px}.trial .tl b{color:#e2c47c}.trial .link{color:#e2c47c;margin-top:4px;font-size:12.5px}
.cmrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #f0e9da}.cmrow:first-child{border-top:0}.cmrow .t{flex:1;min-width:0}.cmrow .t b{display:block;font-weight:600;font-size:13px}.cmrow .t i{display:block;font-style:normal;font-size:11.5px;color:var(--muted)}.cmrow .nums{display:flex;flex-direction:column;align-items:flex-end;direction:ltr;font-size:12px;line-height:1.5;white-space:nowrap}.cmrow .nums b{font-size:13.5px}.cmrow small{font-size:11px;font-weight:500}
.depbar{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid #eadfc4;background:#faf6ec;border-radius:10px;padding:8px 11px;margin-bottom:8px;cursor:pointer;text-align:right}.depbar b{color:var(--brand);font-weight:600}.depbar span{font-size:12px;color:var(--muted)}
.ocbar{display:block;height:6px;border-radius:3px;background:#efe8d8;overflow:hidden;margin-top:3px}.ocbar i{display:block;height:100%;background:var(--gold);border-radius:3px}

/* النافذة الكبيرة: مفيش تسجيل، وزرار القفل بدل التكبير */
#bigClose{display:none}
.big #bigOpen{display:none}.big #bigClose{display:grid}
.big .bar{display:none!important}
.big .stat:after{content:' · نافذة عرض بس';color:#e2c47c}
/* ---------- البانل العريض: لما يتعرّض فوق 720 بكسل ---------- */
@media (min-width:720px){
  :root{--rail:92px}
  html,body{font-size:14.5px}
  .nav{top:0;bottom:0;inset-inline-start:0;inset-inline-end:auto;width:var(--rail);height:auto;flex-direction:column;justify-content:flex-start;gap:6px;padding:74px 10px 14px;background:var(--night);border-top:0;border-inline-end:1px solid rgba(201,162,74,.18);z-index:8}
  .nav button{flex:0 0 auto;padding:11px 0 9px;color:#a99d84;font-size:12px;gap:5px}
  .nav button:hover{background:rgba(255,255,255,.06);color:#e2c47c}
  .nav button.on{background:rgba(201,162,74,.16);color:var(--gold)}
  .nav svg{width:23px;height:23px}
  .top{margin-inline-start:var(--rail);padding:14px 26px 12px}
  .top.hero{padding-bottom:22px}
  .hdate{font-size:30px}
  .hsay{font-size:15px;max-width:900px}
  .subnav{max-width:760px}
  main{margin-inline-start:var(--rail);padding:20px 26px 110px;max-width:calc(1360px + var(--rail))}
  .bar{bottom:0;inset-inline-start:var(--rail);padding:12px 26px;box-shadow:0 -6px 18px rgba(31,26,20,.06)}
  .bar .btn{max-width:260px}
  .sum{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
  .addbtn{max-width:380px}
  #tab-home .kgrid{grid-template-columns:1fr 1fr}
  #form{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:0 14px;align-items:start}
  #form > :not(.card){grid-column:1/-1}
  .sum .v{font-size:20px}
  .filters{grid-template-columns:repeat(4,1fr)}
  .kgrid{grid-template-columns:repeat(4,1fr)}
  .grid2{gap:0 14px}
  /* القوايم: الكروت جنب بعض */
  /* الكروت جنب بعض من غير :has عشان المتصفح مايتقلش */
  .rcard{display:inline-block;vertical-align:top;width:calc(50% - 8px);margin:0 4px 8px}
  /* الرئيسية: الصورة كلها على ناحية والمفضلات على الناحية التانية */
  #tab-home{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:0 18px;align-items:start}
  #tab-home > *{grid-column:1/-1}
  #tab-home > .focus{grid-column:1;grid-row:span 6}
  #tab-home > .lh,#tab-home > .flist,#tab-home > .addfav{grid-column:2}
  #tab-home > .lh{margin-top:0}
  /* التفاصيل بتفتح جنب القايمة مش فوقها */
  .overlay{background:rgba(20,18,14,.28);justify-content:flex-end;align-items:stretch}
  .sheet{width:min(560px,48vw);max-height:none;height:100%;border-radius:0;padding:22px 22px 18px;box-shadow:0 0 40px rgba(20,18,14,.25);animation:sIn .18s ease-out}
  .sheet h2{font-size:18px}
  @keyframes sIn{from{transform:translateX(-24px);opacity:.4}to{transform:none;opacity:1}}
}
@media (min-width:1150px){
  main{padding-inline:34px}.top{padding-inline:34px}
}

<script>
(function(){
'use strict';
var L = window.OsoolLogic;
var A = window.OsoolMockAdapter || window.OsoolExcel;
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
var money = function(n){ return (Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:2}); };
var digits = function(s){ return String(s||'').replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);}).replace(/[٫]/g,'.').replace(/[,،\s]/g,''); };

var S = { units:[], renters:[], monthHeaders:[], unit:null, type:'monthly', typeTouched:false, schedule:[], saving:false };
if (window.OsoolBig) S.tab = window.OsoolBig.tab;

// ---------- تحميل ----------
function load(){
  $('loading').classList.remove('hide'); $('fatal').classList.add('hide');
  ['tab-home','tab-new','tab-search','tab-coll','tab-transfer','tab-avail','tab-treas','tab-owners','tab-review'].forEach(function(id){ $(id).classList.add('hide'); });
  return A.loadAll().then(function(d){
    S.raw = d;
    S.units = L.buildUnits(d.owner);
    S.renters = L.buildRenters(d.renter);
    S.monthHeaders = d.monthHeaders;
    S.months = d.renter.months || {}; S.cash = d.cash || []; S.treasury = null; S.ledger = null;
    S.ownerMonths = d.owner.months || {}; S.categories = d.categories || [];
    $('stat').textContent = S.units.length + ' وحدة';
    fill('dlNat', L.topValues(S.renters,'nationality',30));
    fill('dlOp', L.topValues(S.renters,'operation',20));
    fill('dlBroker', L.topValues(S.renters,'broker',20));
    $('loading').classList.add('hide');
    showTab(S.tab==='transfer' ? 'search' : (S.tab||'home'));
    if (S.unit) selectUnit(S.unit.code);
  }).catch(function(e){
    $('loading').classList.add('hide');
    $('fatal').textContent = 'مقدرتش أقرا الملف: ' + e.message;
    $('fatal').classList.remove('hide');
  });
}
function fill(id, vals){ $(id).innerHTML = vals.map(function(v){ return '<option value="'+esc(v)+'">'; }).join(''); }

// ---------- التنقل: ٤ أقسام تحت، وأقسام فرعية فوق ----------
// التقسيم على حسب الشخص: المستأجر، المالك، الخزينة. والإدارة مخفية بالكود
var GROUPS = {
  home: { title: '', sub: null },
  tenants: { title: 'المستأجرين', sub: [['search','العقود'],['new','عقد جديد'],['coll','التحصيل'],['avail','المتاح']] },
  owners: { title: 'الملاك', sub: [['ownerc','العقود'],['ownernew','عقد جديد'],['owners','السداد']] },
  treasury: { title: 'الخزينة', sub: [['treas','الحركات'],['review','المراجعة']] },
  admin: { title: 'الإدارة', sub: [['prof','الربحية'],['cmp','المقارنة'],['occ','الإشغال'],['dev','المطور']] }
};
var GROUP_OF = { home:'home', search:'tenants', 'new':'tenants', transfer:'tenants', coll:'tenants', avail:'tenants', owners:'owners', ownerc:'owners', treas:'treasury', review:'treasury', prof:'admin', cmp:'admin', occ:'admin', dev:'admin' };
var ALL_TABS = ['prof','occ','ownerc','cmp','dev','home','new','search','coll','transfer','avail','treas','owners','review'];
var LAST = { tenants:'search', owners:'ownerc', treasury:'treas', admin:'prof', home:'home' };
var ADMIN_TABS = ['prof','cmp','occ','dev'];
// ---------- شاشة المقارنة: مخفية ومبتظهرش غير بعد كود على الجهاز ----------
var CMP_KEY = 'osoolPanel.cmp';
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { if (v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); } catch(e){} }
function cmpOn(){ return lsGet(CMP_KEY)==='1'; }
// الإدارة: زرار خامس تحت وعلامة فوق، بيظهروا بس بعد الكود على الجهاز ده
function cmpSync(){
  $('navAdmin').classList.toggle('hide', !cmpOn());
  $('brandMbm').classList.toggle('on', cmpOn());
}
function cmpLock(){ lsSet(CMP_KEY,null); cmpSync(); if (ADMIN_TABS.indexOf(S.tab) !== -1) showTab('home'); }
(function(){
  // وضع البرو: ضغطة طويلة على MBM بتفتحه بالكود، وضغطة طويلة تانية (أو دوسة على PRO) بتقفله
  var pt = null, fired = false;
  function proSheet(){
    // window.prompt مبيشتغلش جوه إضافات الأوفيس، فالكود بيتكتب في شاشة جوه البانل
    $('sheet').innerHTML = '<h2>MBM PRO</h2><div class="r2" style="margin:-4px 0 10px">اكتب الكود</div>' +
      '<input id="cmpCode" type="password" inputmode="numeric" autocomplete="off" style="width:100%;font-size:20px;text-align:center;letter-spacing:8px;padding:10px;border:1px solid var(--line,#ddd);border-radius:10px">' +
      '<div id="cmpMsg" class="r2" style="min-height:20px;margin:6px 0;text-align:center;color:#a33"></div>' +
      '<button class="btn primary" id="cmpGo" style="width:100%">فعّل</button>';
    $('ov').classList.add('on');
    var inp = $('cmpCode'); setTimeout(function(){ inp.focus(); }, 50);
    function go(){
      if (String(inp.value).trim() === '0000') { lsSet(CMP_KEY,'1'); cmpSync(); $('ov').classList.remove('on'); showTab('prof'); }
      else { $('cmpMsg').textContent = 'الكود مش صح'; inp.value = ''; inp.focus(); }
    }
    $('cmpGo').onclick = go;
    inp.onkeydown = function(ev){ if (ev.key === 'Enter') go(); };
  }
  function lockSheet(){
    $('sheet').innerHTML = '<h2>MBM PRO</h2><div class="r2" style="margin:-4px 0 12px">تقفل وضع البرو وترجع لشكل الفريق؟</div>' +
      '<div style="display:flex;gap:8px"><button class="btn ghost" id="proNo">لأ</button><button class="btn primary" id="proOff" style="flex:1">اقفل</button></div>';
    $('ov').classList.add('on');
    $('proNo').onclick = function(){ $('ov').classList.remove('on'); };
    $('proOff').onclick = function(){ $('ov').classList.remove('on'); cmpLock(); };
  }
  function held(){ fired = true; $('brandMbm').classList.remove('hold'); if (cmpOn()) lockSheet(); else proSheet(); }
  function cancel(){ clearTimeout(pt); pt = null; $('brandMbm').classList.remove('hold'); }
  var el = $('brandMbm');
  el.addEventListener('pointerdown', function(e){ fired = false; cancel(); el.classList.add('hold'); pt = setTimeout(held, 1200); });
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){ el.addEventListener(ev, cancel); });
  el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  // دوسة عادية على PRO بتقفل برضه
  el.addEventListener('click', function(){ if (fired) { fired = false; return; } if (cmpOn()) lockSheet(); });
})();
cmpSync();
function showTab(t){
  if (ADMIN_TABS.indexOf(t) !== -1 && !cmpOn()) t = 'home';
  S.tab = t;
  var g = GROUP_OF[t] || 'home';
  if (LAST[g] !== undefined && t !== 'transfer') LAST[g] = t;
  ALL_TABS.forEach(function(x){ $('tab-'+x).classList.toggle('hide', t!==x); });
  document.querySelectorAll('#nav button').forEach(function(b){ b.classList.toggle('on', b.dataset.g===g); });
  var isHome = t==='home';
  $('top').classList.toggle('hero', isHome);
  $('hero').classList.toggle('hide', !isHome);
  $('crumb').classList.toggle('hide', isHome);
  $('crumb').textContent = GROUPS[g].title;
  var sub = GROUPS[g].sub;
  $('subnav').classList.toggle('hide', !sub || sub.length < 2);
  if (sub) $('subnav').innerHTML = sub.map(function(x){ return '<button data-t="'+x[0]+'"'+((x[0]===t||(t==='transfer'&&x[0]==='search'))?' class="on"':'')+'>'+x[1]+'</button>'; }).join('');
  $('bar').classList.toggle('hide', t!=='new' || !$('doneView').classList.contains('hide'));
  window.scrollTo(0,0);
  if (t==='search') setTimeout(function(){ $('sQ').focus(); }, 30);
  if (t==='home' && window.OsoolHome) OsoolHome.render();
  if (t==='dev' && window.OsoolDev) OsoolDev.open();
  if (window.OsoolScreens && OsoolScreens.onTab) OsoolScreens.onTab(t);
}
document.querySelectorAll('#nav button').forEach(function(b){ b.addEventListener('click', function(){ showTab(LAST[b.dataset.g]); }); });
$('subnav').addEventListener('click', function(e){
  var b=e.target.closest('button[data-t]'); if(!b) return;
  // عقد مالك جديد = تكويد وحدة جديدة: بيفتح الفورم فوق شاشة عقود الملاك
  if (b.dataset.t==='ownernew'){ if (S.tab!=='ownerc') showTab('ownerc'); OsoolScreens.openOwnerNew(); return; }
  showTab(b.dataset.t);
});
$('hSearch').addEventListener('click', function(){ showTab('search'); });
$('reload').addEventListener('click', load);
// ---------- النافذة الكبيرة: نفس البانل فوق الإكسيل للعرض ----------
function openBig(){
  var ui = window.Office && Office.context && Office.context.ui;
  if (!ui || !ui.displayDialogAsync || !(Office.context.requirements && Office.context.requirements.isSetSupported('DialogApi','1.2'))){
    alert('النسخة دي من الإكسيل مش بتدعم النافذة الكبيرة. وسّع البانل من حرفه بدلها.'); return;
  }
  if (!S.raw){ alert('استنى البيانات تخلص تحميل.'); return; }
  var btn = $('bigOpen'); btn.disabled = true;
  OsoolScreens.ensureSettings().then(OsoolScreens.ensureTreasury).then(function(){
    var json = JSON.stringify({ all:S.raw, treasury:S.treasury, settings:S.settings||null });
    var url = location.href.replace(/[^\/]*([?#].*)?$/, '') + 'taskpane.html?big=1&tab=' + encodeURIComponent(S.tab||'home') + (cmpOn()?'&cmp=1':'');
    ui.displayDialogAsync(url, { width:96, height:94, displayInIframe:true }, function(r){
      btn.disabled = false;
      if (r.status !== 'succeeded'){ alert('مقدرتش أفتح النافذة: ' + (r.error && r.error.message || '')); return; }
      var dlg = r.value, CH = 24000, n = Math.ceil(json.length / CH);
      dlg.addEventHandler(Office.EventType.DialogMessageReceived, function(m){
        var x; try { x = JSON.parse(m.message); } catch(e){ return; }
        if (x.ready){ for (var i = 0; i < n; i++) dlg.messageChild(JSON.stringify({ i:i, n:n, d:json.slice(i*CH, (i+1)*CH) })); }
        if (x.close) dlg.close();
        if (x.goto){ dlg.close(); (x.goto[0]==='renter' ? A.goToRow(x.goto[1]) : A.goTo(x.goto[0], x.goto[1])).catch(function(e){ alert(e.message); }); }
      });
    });
  }).catch(function(e){ btn.disabled = false; alert(e.message); });
}
$('bigOpen').addEventListener('click', openBig);

$('bigClose').addEventListener('click', function(){ window.OsoolBig && window.OsoolBig.close(); });

// ---------- الوحدة ----------
// البحث في نطاق الملف بس (إعدادات ⚙): الوحدات والمستأجرين اللي وحدتهم جوه النطاق
function scopeUnits(){ var F=window.OsoolFollow, st=S.settings||F.DEFAULT_SETTINGS; return S.units.filter(function(u){ return F.inScope(u, st, true); }); }
function scopeRenters(){ var ok={}; scopeUnits().forEach(function(u){ ok[u.code]=1; }); return S.renters.filter(function(r){ return ok[r.unit]; }); }
function unitTitle(u){ var ok=function(v){ return v && v!=='0'; }; return [u.project, ok(u.block) && ('بلوك '+u.block), ok(u.building) && ('عمارة '+u.building), ok(u.apt) && ('شقة '+u.apt)].filter(Boolean).join(' · '); }
$('unitQ').addEventListener('input', function(){
  var res = L.searchUnits(scopeUnits(), this.value), box = $('unitRes');
  if (!this.value.trim()) { box.classList.add('hide'); return; }
  box.classList.remove('hide');
  box.innerHTML = res.length ? res.map(function(u){
    return '<button data-code="'+esc(u.code)+'"><div class="r1">'+esc(unitTitle(u)||u.code)+'</div><div class="r2">كود '+esc(u.code)+' · '+esc(u.owner)+'</div></button>';
  }).join('') : '<div class="r2" style="padding:10px">مفيش وحدة بالبيانات دي.</div>';
});
$('unitRes').addEventListener('click', function(e){ var b=e.target.closest('button'); if(b) selectUnit(b.dataset.code); });

function selectUnit(code){
  var u = S.units.filter(function(x){ return x.code===String(code); })[0];
  if (!u) return;
  S.unit = u;
  var st = L.unitStatus(u.code, S.renters);
  var codes = S.renters.map(function(r){ return r.code; });
  var cur = st.current ? esc(st.current.name)+' لحد '+L.fmt(st.current.end) : 'فاضية';
  var up = st.upcoming.length ? st.upcoming.map(function(r){ return esc(r.name)+' ('+L.fmt(r.start)+' – '+L.fmt(r.end)+')'; }).join('<br>') : 'مفيش';
  $('unitCard').innerHTML =
    '<div class="unit"><div class="head"><div><div class="t">'+esc(unitTitle(u)||('وحدة '+u.code))+'</div><div class="r2">المالك: '+esc(u.owner||'—')+(u.bedrooms?' · '+esc(u.bedrooms)+' غرف':'')+'</div></div><button class="link" id="chg">تغيير</button></div>'+
    '<dl class="kv"><dt>ساكن دلوقتي</dt><dd>'+cur+'</dd><dt>حجوزات جاية</dt><dd>'+up+'</dd><dt>نهاية عقد المالك</dt><dd>'+L.fmt(u.ownerEnd)+'</dd></dl>'+
    '<div class="code"><span class="r2">كود المستأجر الجديد</span><b>'+esc(L.nextTenantCode(u.code, codes))+'</b></div></div>';
  $('unitPick').classList.add('hide'); $('unitCard').classList.remove('hide');
  $('chg').addEventListener('click', function(){ S.unit=null; $('unitCard').classList.add('hide'); $('unitPick').classList.remove('hide'); $('unitQ').value=''; $('unitRes').classList.add('hide'); $('unitQ').focus(); refresh(); });
  refresh();
}

// ---------- النوع والتواريخ ----------
function setType(t, byUser){
  S.type = t; if (byUser) S.typeTouched = true;
  document.querySelectorAll('#typeSeg button').forEach(function(b){ b.classList.toggle('on', b.dataset.type===t); });
  $('rateBox').classList.toggle('hide', t!=='nightly');
  if (byUser && !$('durN').value) $('durU').value = t==='nightly' ? 'n' : 'm';
  $('rentBox').classList.toggle('hide', t!=='monthly');
}
document.querySelectorAll('#typeSeg button').forEach(function(b){ b.addEventListener('click', function(){ setType(b.dataset.type, true); refresh(); }); });
function applyDuration(){
  var s=L.parseISO($('start').value), n=parseInt(digits($('durN').value),10);
  if (!s || !(n>0)) return false;
  $('end').value = L.toISO(L.endFromDuration(s, n, $('durU').value));
  return true;
}
$('durN').addEventListener('input', function(){ if (applyDuration()) $('end').dispatchEvent(new Event('change')); });
$('durU').addEventListener('change', function(){ if (applyDuration()) $('end').dispatchEvent(new Event('change')); });
['start','end'].forEach(function(id){ $(id).addEventListener('change', function(ev){
  if (id==='start') applyDuration();
  if (id==='end' && ev.isTrusted) $('durN').value='';
  var s=L.parseISO($('start').value), e=L.parseISO($('end').value);
  if (s && e && !S.typeTouched) setType(L.daysBetween(s,e) < 30 ? 'nightly' : 'monthly');
  refresh();
}); });
$('special').addEventListener('input', function(){ $('specialRateBox').classList.toggle('hide', this.value.trim()!=='ابو ادم'); refresh(); });
document.querySelectorAll('.num').forEach(function(i){ i.addEventListener('blur', function(){ this.value = digits(this.value); }); });
['rate','rent','name','phone'].forEach(function(id){ $(id).addEventListener('input', refresh); });

// ---------- الحساب والعرض ----------
function readForm(){
  return {
    unit:S.unit, type:S.type,
    start:L.parseISO($('start').value), end:L.parseISO($('end').value), notifyDate:L.parseISO($('notifyDate').value),
    name:$('name').value, nationality:$('nationality').value, phone:digits($('phone').value).replace(/^\+/,''), idNo:$('idNo').value.trim(),
    rate:digits($('rate').value), rent:digits($('rent').value), deposit:$('deposit').value, utilities:$('utilities').value, collectEvery:$('collectEvery').value,
    special:$('special').value.trim(), specialRate:$('specialRate').value, operation:$('operation').value, broker:$('broker').value, brokerFee:digits($('brokerFee').value),
    receipt:$('receipt').value, notes:$('notes').value, schedule:S.schedule,
    shift:(S.shift===null||S.shift===undefined) ? undefined : S.shift
  };
}
function schedKey(f){ return [f.type,f.start&&+f.start,f.end&&+f.end,f.rate,f.rent,f.shift].join('|'); }
document.querySelectorAll('#shiftSeg button').forEach(function(b){ b.addEventListener('click', function(){ S.shift = +b.dataset.shift; refresh(); }); });

function refresh(){
  var f = readForm();
  var s=f.start, e=f.end;
  var effShift = f.shift===undefined ? L.defaultShift(s) : f.shift;
  $('shiftBox').classList.toggle('hide', f.type!=='monthly' || !s);
  document.querySelectorAll('#shiftSeg button').forEach(function(b){ b.classList.toggle('on', +b.dataset.shift===effShift); });
  if (s && e && e>s){ $('dur').textContent = L.durationText(s,e); $('dur').classList.remove('hide'); } else $('dur').classList.add('hide');
  var k = schedKey(f);
  if (k !== S.schedKey){ S.schedKey = k; S.schedule = L.buildSchedule(f); renderSchedule(); }
  f.schedule = S.schedule;
  renderMsgs(f);
}
function renderSchedule(){
  var box = $('sched');
  if (!S.schedule.length){ box.innerHTML = '<div class="empty">هيظهر هنا بعد ما تحدد التواريخ والمبلغ.</div>'; return; }
  box.innerHTML = '<table class="sch">'+S.schedule.map(function(r,i){
    var missing = S.monthHeaders.length && S.monthHeaders.indexOf(r.key)===-1;
    return '<tr><td class="m">'+L.monthLabel(r.key)+(r.note?'<div class="note">'+esc(r.note)+'</div>':'')+(missing?'<div class="note" style="color:var(--err)">العمود مش موجود</div>':'')+'</td><td><input class="ltr" data-i="'+i+'" value="'+r.amount+'" inputmode="decimal"></td>'+
      '<td style="width:26px;text-align:left"><button class="link" data-del="'+i+'" title="حذف الشهر" aria-label="حذف الشهر" style="text-decoration:none;color:var(--muted);font-size:16px">×</button></td></tr>';
  }).join('')+'</table>'+
  '<div style="display:flex;gap:14px;margin-top:8px"><button class="link" id="addFirst">+ شهر قبل الأول</button><button class="link" id="addLast">+ شهر بعد الأخير</button></div>'+
  '<div class="total"><span>الإجمالي</span><span id="tot"></span></div>';
  box.querySelectorAll('input').forEach(function(inp){ inp.addEventListener('input', function(){
    S.schedule[+this.dataset.i].amount = Number(digits(this.value))||0; updateTotal(); renderMsgs(readForm());
  }); });
  box.querySelectorAll('button[data-del]').forEach(function(b){ b.addEventListener('click', function(){
    S.schedule.splice(+b.dataset.del,1); renderSchedule(); renderMsgs(readForm());
  }); });
  function neighbour(key, k){ var p=key.split('-'); var d=new Date(Date.UTC(2000+ +p[1], ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].indexOf(p[0]), 1)); return L.monthKey(L.addMonths(d,k)); }
  $('addFirst').addEventListener('click', function(){ S.schedule.unshift({key:neighbour(S.schedule[0].key,-1), amount:0, note:'مضاف يدوي'}); renderSchedule(); renderMsgs(readForm()); });
  $('addLast').addEventListener('click', function(){ S.schedule.push({key:neighbour(S.schedule[S.schedule.length-1].key,1), amount:0, note:'مضاف يدوي'}); renderSchedule(); renderMsgs(readForm()); });
  updateTotal();
}
function updateTotal(){ var t=S.schedule.reduce(function(a,r){return a+(Number(r.amount)||0);},0); if($('tot')) $('tot').textContent = money(t); }

function renderMsgs(f){
  f.schedule = S.schedule; f.rate = f.special==='ابو ادم' ? f.specialRate : f.rate;
  var v = L.validate(normalizeForSave(f), { renters:S.renters, monthHeaders:S.monthHeaders });
  S.validation = v;
  var touched = S.unit || f.start || f.name;
  $('msgs').innerHTML = !touched ? '' : v.warnings.map(function(w){ return '<div class="msg warn">'+esc(w)+'</div>'; }).join('');
}
// خانة "Rate" في الشيت خاصة بأبو آدم؛ سعر الليلة بيروح في جدول الاستحقاق كمعادلة
function normalizeForSave(f){
  var o = {}; for (var k in f) o[k]=f[k];
  o.rate = f.special==='ابو ادم' ? f.specialRate : '';
  o.nightRate = f.type==='nightly' ? digits($('rate').value) : '';
  return o;
}

// ---------- الحفظ ----------
$('review').addEventListener('click', function(){
  var f = normalizeForSave(readForm()); f.schedule = S.schedule;
  var v = L.validate(f, { renters:S.renters, monthHeaders:S.monthHeaders });
  if (v.errors.length){
    $('msgs').innerHTML = v.errors.map(function(x){ return '<div class="msg err">'+esc(x)+'</div>'; }).join('') + v.warnings.map(function(w){ return '<div class="msg warn">'+esc(w)+'</div>'; }).join('');
    $('msgs').scrollIntoView({behavior:'smooth',block:'center'}); return;
  }
  var codes = S.renters.map(function(r){ return r.code; });
  var code = L.nextTenantCode(f.unit.code, codes);
  $('sheet').innerHTML = '<h2>راجع قبل الحفظ</h2>'+
    '<dl class="kv"><dt>الوحدة</dt><dd>'+esc(unitTitle(f.unit)||f.unit.code)+'</dd><dt>كود المستأجر</dt><dd><b class="ltr" style="direction:ltr;display:inline-block">'+esc(code)+'</b></dd><dt>المستأجر</dt><dd>'+esc(f.name)+'</dd>'+
    '<dt>الفترة</dt><dd>'+L.fmt(f.start)+' ← '+L.fmt(f.end)+'<br><span class="r2">'+L.durationText(f.start,f.end)+'</span></dd>'+
    '<dt>الاستحقاق</dt><dd>'+S.schedule.map(function(r){return L.monthLabel(r.key)+': '+money(r.amount);}).join('<br>')+'</dd><dt>الإجمالي</dt><dd><b>'+money(v.total)+'</b></dd></dl>'+
    (v.warnings.length? '<div style="margin-top:10px">'+v.warnings.map(function(w){return '<div class="msg warn">'+esc(w)+'</div>';}).join('')+'</div>':'')+
    '<p class="r2">هيتكتب في أول سطر فاضي بعد آخر عقد في شيت عقود المستأجرين.</p>'+
    '<div style="display:flex;gap:8px"><button class="btn ghost" id="back">رجوع</button><button class="btn primary" id="go">تأكيد الحفظ</button></div>';
  $('ov').classList.add('on');
  $('back').addEventListener('click', function(){ $('ov').classList.remove('on'); });
  $('go').addEventListener('click', function(){ save(f); });
});
$('ov').addEventListener('click', function(e){ if(e.target===this && !S.saving) this.classList.remove('on'); });

function save(f){
  if (S.saving) return; S.saving = true;
  var go = $('go'); go.disabled = true; go.textContent = 'بيحفظ…';
  A.writeContract(f).then(function(res){
    S.saving = false; $('ov').classList.remove('on');
    S.renters.push({ idx:res.idx, unit:f.unit.code, code:res.code, start:f.start, end:f.end, name:f.name.trim(), phone:f.phone, idNo:f.idNo, nationality:f.nationality, special:f.special, operation:f.operation, broker:f.broker });
    $('stat').textContent = S.units.length + ' وحدة';
    $('form').classList.add('hide'); $('bar').classList.add('hide');
    $('doneView').classList.remove('hide');
    $('doneView').innerHTML = '<div class="card done"><div class="big">✓</div><h2 style="margin:4px 0">اتسجل العقد</h2>'+
      '<div class="r2">في السطر '+res.sheetRow+' بشيت عقود المستأجرين</div>'+
      '<div class="code" style="margin:14px 0;border:1px solid var(--line)"><span class="r2">كود المستأجر</span><b>'+esc(res.code)+'</b></div>'+
      (res.duplicate?'<div class="msg err">الكود ده ظهر مرتين في الجدول. غالباً حد تاني سجل في نفس اللحظة، راجع السطر.</div>':'')+
      checkHtml(res)+
      (res.skipped.length?'<div class="msg warn">خانات متكتبتش لأن عمودها مش موجود: '+esc(res.skipped.join('، '))+'</div>':'')+
      '<div style="display:flex;gap:8px"><button class="btn ghost" id="copy">نسخ الكود</button><button class="btn primary" id="again">عقد جديد</button></div></div>';
    $('copy').addEventListener('click', function(){ copyText(res.code, this); });
    $('again').addEventListener('click', resetForm);
  }).catch(function(e){
    S.saving = false; go.disabled = false; go.textContent = 'تأكيد الحفظ';
    var m = document.createElement('div'); m.className='msg err'; m.textContent = 'الحفظ موقف: ' + e.message;
    $('sheet').insertBefore(m, $('sheet').children[1]);
  });
}
function copyText(t, btn){
  var orig = btn.textContent; var ok = function(){ btn.textContent='اتنسخ'; setTimeout(function(){ btn.textContent=orig==='اتنسخ'?'نسخ':orig; },1500); };
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(ok, function(){ fallback(); }); else fallback();
  function fallback(){ var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(_){} ta.remove(); ok(); }
}
function resetForm(){
  document.querySelectorAll('#form input, #form textarea').forEach(function(i){ i.value=''; });
  $('receipt').value=''; S.unit=null; S.typeTouched=false; S.schedKey=null; S.schedule=[]; S.shift=null; $('shiftBox').classList.add('hide');
  $('unitCard').classList.add('hide'); $('unitPick').classList.remove('hide'); $('unitRes').classList.add('hide');
  $('specialRateBox').classList.add('hide'); setType('monthly'); renderSchedule(); $('msgs').innerHTML=''; $('dur').classList.add('hide');
  $('doneView').classList.add('hide'); $('form').classList.remove('hide'); $('bar').classList.remove('hide');
  window.scrollTo(0,0);
}
$('clear').addEventListener('click', function(){ if (confirm('تفريغ كل الخانات؟')) resetForm(); });

// ---------- البحث ----------
$('sQ').addEventListener('input', function(){
  var res = L.searchRenters(scopeRenters(), this.value, 30), today = L.todayUTC();
  var q = this.value.trim();
  if (q.length < 2){ $('sRes').innerHTML=''; return; }
  if (!res.length){ $('sRes').innerHTML='<div class="empty" style="padding:6px">مفيش نتايج.</div>'; return; }
  $('sRes').innerHTML = res.map(function(r){
    var u = S.units.filter(function(x){ return x.code===r.unit; })[0];
    var b = !r.start||!r.end ? '' : r.start>today ? '<span class="badge book">محجوز</span>' : r.end>=today ? '<span class="badge live">ساري</span>' : '<span class="badge done">انتهى</span>';
    return '<div class="rcard"><div class="top2"><div><div class="r1">'+esc(r.name||'—')+'</div><div class="r2" style="direction:ltr;text-align:right">'+esc(r.code)+'</div></div>'+b+'</div>'+
      '<dl class="kv"><dt>الوحدة</dt><dd>'+esc(u?unitTitle(u):r.unit)+'</dd><dt>الفترة</dt><dd>'+L.fmt(r.start)+' ← '+L.fmt(r.end)+'</dd>'+
      (r.phone?'<dt>التليفون</dt><dd class="ltr" style="direction:ltr;text-align:right">'+esc(r.phone)+'</dd>':'')+
      (r.nationality?'<dt>الجنسية</dt><dd>'+esc(r.nationality)+'</dd>':'')+'</dl>'+
      '<div style="display:flex;gap:14px;margin-top:6px;flex-wrap:wrap">'+(r.idx>=0?'<button class="link" data-idx="'+r.idx+'">روح للسطر في الشيت</button>':'')+
      (r.idx>=0 && r.end && r.end>today && r.start && r.start<r.end ? '<button class="link" data-transfer="'+r.idx+'">نقل لوحدة تانية</button>':'')+
      (r.idx>=0 && r.end && r.start && r.end.getUTCFullYear()<2090 && r.end>=new Date(today.getTime()-30*864e5) ? '<button class="link" data-extend="'+r.idx+'">تمديد</button>':'')+
      (r.idx>=0 ? '<button class="link" data-stmt="'+r.idx+'">كشف حساب</button>':'')+
      (r.idx>=0 && r.end && r.start && r.end>today && r.end.getUTCFullYear()<2090 ? '<button class="link" data-early="'+r.idx+'">تسليم مبكر</button>':'')+'</div></div>';
  }).join('');
});
$('sRes').addEventListener('click', function(e){
  var tb = e.target.closest('button[data-transfer]');
  if (tb){ OsoolScreens.startTransfer(+tb.dataset.transfer); return; }
  var sb = e.target.closest('button[data-stmt]');
  if (sb){ OsoolScreens.openStatement('tenant', +sb.dataset.stmt); return; }
  var xb = e.target.closest('button[data-extend],button[data-early]');
  if (xb){ OsoolScreens.openContractEdit(+(xb.dataset.extend||xb.dataset.early), xb.dataset.extend!==undefined?'extend':'early'); return; }
  var b = e.target.closest('button[data-idx]'); if(!b) return;
  A.goToRow(+b.dataset.idx).catch(function(err){ alert(err.message); });
});

function checkHtml(res){
  var m = (res && res.mismatch) || [];
  if (!m.length) return '<div class="msg ok">اتأكدت: رجعت قريت كل الخانات من الملف واتكتبت صح.</div>';
  return '<div class="msg err"><b>اتكتب، بس فيه '+m.length+' خانة مختلفة عن المطلوب. راجعها:</b>'+m.slice(0,8).map(function(x){ return '<div>'+esc(x.table||'')+' · سطر '+x.row+' · '+esc(x.key)+': المفروض '+esc(x.expected)+'، اتكتب '+esc(x.got)+'</div>'; }).join('')+'</div>';
}
